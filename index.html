async function shrinkImage(file,max=1600){ return new Promise((res,rej)=>{ const img=new Image(); const u=URL.createObjectURL(file); img.onload=()=>{ let w=img.naturalWidth,h=img.naturalHeight; const k=Math.min(1,max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k); const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg',0.82)); }; img.onerror=rej; img.src=u; }); }

async function submitRsvp(){
 const L=t(); S.name=($('#fName').value||'').trim(); S.phone=$('#fPhone').value; S.sms=$('#fSms').checked;
 const digits=S.phone.replace(/\D/g,'').slice(-10);
 if(!S.name||digits.length!==10){toast(!S.name?L.need_name:L.bad_phone);goTo(pages().length-1);return}
 if(!Object.values(S.rs).some(r=>r.status)){toast(L.nothing);return}
 const btn=$('#sendBtn'); btn.disabled=true; btn.textContent='…';
 try{
  const {data:fam,error}=await sb.rpc('family_start',{p_name:S.name,p_phone:digits,p_lang:S.lang,p_tier:'open',p_sms:S.sms});
  if(error)throw error;
  applyFamily(fam); ls('token',S.token);
  const sent=$('#fSent')?.checked||false;
  for(const e of visibleEvents()){const r=rs(e.id); if(!r.status)continue;
   const {error:er}=await sb.rpc('rsvp_set',{p_token:S.token,p_event:e.id,p_status:r.status,p_headcount:r.headcount|0,p_players:r.players|0,p_watchers:r.watchers|0,p_paid_claimed:(sent&&evTotal(e.id)>0)?true:null});
   if(er){ if((er.message||'').includes('full')){toast(L.full);r.status='maybe'} else if(!(er.message||'').includes('not_invited')) throw er; }
  }
  S.done=true; await loadFamily(); toast(L.saved); render(); goTo(pages().length-1);
 }catch(e){console.error(e);toast('Hmm, that didn\'t save. Try again.');}
 btn.disabled=false;
}

 applyFamily(f); persistLocal();

}

function parseCsv(text){const rows=[];let row=[],cur='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else{if(c==='"')q=true;else if(c===','){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}else cur+=c}}if(cur.length||row.length){row.push(cur);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))}
function parseContactsCsv(text){
 const rows=parseCsv(text); if(rows.length<2)return []; const H=rows[0].map(h=>h.trim().toLowerCase());
 const idx=n=>H.findIndex(h=>h===n); const find=re=>H.map((h,i)=>re.test(h)?i:-1).filter(i=>i>=0);
 const iName=idx('name')>=0?idx('name'):idx('display name'); const iFirst=idx('first name'),iLast=idx('last name'),iOrg=idx('organization name')>=0?idx('organization name'):idx('organization 1 - name');
 const phoneCols=find(/^phone \d+ - value$/).concat(find(/^(mobile|phone|cell)( phone)?$/)); const iLabels=idx('labels')>=0?idx('labels'):idx('group membership');
 const out=[]; for(const r of rows.slice(1)){
  let name=(iName>=0?r[iName]:'')||[iFirst>=0?r[iFirst]:'',iLast>=0?r[iLast]:''].join(' ').trim()||(iOrg>=0?r[iOrg]:''); name=(name||'').trim();
  let phone=''; for(const c of phoneCols){const v=(r[c]||'').split(':::')[0].replace(/\D/g,'');const d=v.length===11&&v[0]==='1'?v.slice(1):v;if(d.length===10){phone=d;break}}
  if(!phone)continue;
  const labels=(iLabels>=0?(r[iLabels]||''):'').split(/\s*:::\s*|\s*,\s*/).map(l=>l.replace(/^\* /,'').replace(/^myContacts$/i,'').replace(/^starred$/i,'').trim()).filter(Boolean);
  out.push({name,phone,labels});
 } return out;
}

/* ---------- pager: pages scroll inside, firm pull or chevron moves between pages ---------- */
const P={i:0,lock:false,y0:0,t0:0,armed:0};
const pages=()=>[...document.querySelectorAll('#app>section')];
function goTo(i){const ps=pages();i=Math.max(0,Math.min(ps.length-1,i));if(P.lock)return;P.lock=true;P.i=i;
 ps[i].scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>{P.lock=false;updateBar()},550);updateNav()}
function atTop(el){return el.scrollTop<=1}
function atBottom(el){const rem=el.scrollHeight-(el.scrollTop+el.clientHeight); return rem<=2 || (el.id==='ev-hero' && rem<=140) || rem<=90}
function curPage(){const ps=pages();const top=$('#app').scrollTop;let best=0,d=1e9;ps.forEach((p,k)=>{const dd=Math.abs(p.offsetTop-top);if(dd<d){d=dd;best=k}});return best}
function initPager(){
 const app=$('#app'); const TH=120;
 // Paging only happens when a swipe BEGINS with the page already resting at its edge.
 // The swipe that scrolls you to the bottom never pages; the next deliberate pull does.
 app.addEventListener('touchstart',e=>{const sec=e.target.closest('#app>section');P.y0=e.touches[0].clientY;P.t0=Date.now();P.eT=sec?atTop(sec):false;P.eB=sec?atBottom(sec):false;P.sec=sec},{passive:true});
 app.addEventListener('touchend',e=>{
  if(P.lock||!P.sec)return; const dy=P.y0-(e.changedTouches[0].clientY); const fast=Date.now()-P.t0<700;
  if(P.eB&&dy>TH&&atBottom(P.sec)&&fast)goTo(curPage()+1);
  else if(P.eT&&dy<-TH&&atTop(P.sec)&&fast)goTo(curPage()-1);
 },{passive:true});
 let acc=0,last=0,edgeSince=0;
 app.addEventListener('wheel',e=>{
  const sec=e.target.closest('#app>section'); if(!sec||P.lock)return; const now=Date.now();
  const atEdge=(e.deltaY>0&&atBottom(sec))||(e.deltaY<0&&atTop(sec));
  if(!atEdge){acc=0;edgeSince=0;return}
  if(!edgeSince){edgeSince=now;acc=0;return} // first tick at the edge just marks arrival
  if(now-last>500)acc=0; last=now; acc+=e.deltaY;
  if(now-edgeSince>250&&Math.abs(acc)>200){goTo(curPage()+(acc>0?1:-1));acc=0;edgeSince=0}
 },{passive:true});
 window.addEventListener('resize',()=>{const ps=pages();if(ps[P.i])ps[P.i].scrollIntoView({block:'start'})});
}

(function(){ const t1=setTimeout(()=>{const m=document.getElementById('splashMsg'); if(m) m.textContent=(ls('lang')==='es'?'Casi listo…':'Almost there…');},4000);
  const t2=setTimeout(()=>{const m=document.getElementById('splashMsg'), b=document.getElementById('splashRetry'); if(m&&document.getElementById('splash')){ m.textContent=(ls('lang')==='es'?'Está tardando más de lo normal':'Taking longer than usual'); if(b){b.style.display='';b.onclick=()=>location.reload();} }},12000);
  boot().then(()=>{clearTimeout(t1);clearTimeout(t2)}).catch(err=>{ clearTimeout(t1);clearTimeout(t2); console.error(err); const m=document.getElementById('splashMsg'), b=document.getElementById('splashRetry'), d=document.querySelector('#splash .dots'); if(m){ m.textContent=(ls('lang')==='es'?'No pudimos conectar. Revisa tu señal e intenta de nuevo.':"Couldn't connect. Check your signal and try again."); m.style.textTransform='none'; m.style.letterSpacing='0'; } if(d) d.style.display='none'; if(b){b.style.display='';b.onclick=()=>location.reload();} });
})();
// Stale-cache guard: GitHub Pages + home-screen apps can hold an old build for a while. If the server's build differs, reload once.
(async()=>{ try{ if(sessionStorage.getItem('fresh'))return; const r=await fetch('/build.txt?'+Date.now(),{cache:'no-store'}); if(!r.ok)return; const v=(await r.text()).trim(); if(v&&v>BUILD){ sessionStorage.setItem('fresh','1'); location.reload(); } }catch(e){} })();
document.addEventListener('visibilitychange',async()=>{ if(document.visibilityState!=='visible')return; try{ const r=await fetch('/build.txt?'+Date.now(),{cache:'no-store'}); const v=(await r.text()).trim(); if(v&&v>BUILD&&!document.querySelector('.modal')&&!sessionStorage.getItem('fresh')){ sessionStorage.setItem('fresh','1'); location.reload(); } }catch(e){} });
</script>
