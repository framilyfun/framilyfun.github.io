 $('#bOn').onclick=async()=>{const l=$('#bl').value;if(!l)return;const {data:n}=await sb.rpc('admin_bulk_invite',{p_pass:pass,p_label:l,p_event:$('#be').value,p_on:true});toast(`Invited ${n}`);renderGuestList(pass)};
 $('#bOff').onclick=async()=>{const l=$('#bl').value;if(!l)return;if(!confirm(`Uninvite everyone tagged ${l}?`))return;const {data:n}=await sb.rpc('admin_bulk_invite',{p_pass:pass,p_label:l,p_event:$('#be').value,p_on:false});toast(`Removed ${n}`);renderGuestList(pass)};
 $('#hosts').onclick=()=>{const lines=hosts.map(h=>`${h.event_id}: ${h.name||''} ${fmtPhone(h.phone)}`).join('\n');const v=prompt('Hosts (one per line: event_id, name, cell). Event ids: '+evs.map(e=>e.id).join(', ')+'\n\nCurrent:\n'+lines+'\n\nAdd one as "event_id, Name, 9541234567" or "remove event_id, 9541234567":');if(!v)return;const parts=v.replace(/^remove\s+/i,'').split(',').map(x=>x.trim());if(/^remove/i.test(v)){sb.rpc('admin_host_set',{p_pass:pass,p_event:parts[0],p_phone:parts[1],p_remove:true}).then(()=>renderGuestList(pass))}else{sb.rpc('admin_host_set',{p_pass:pass,p_event:parts[0],p_phone:parts[2],p_name:parts[1]}).then(()=>renderGuestList(pass))}};
 $('#csvIn').onchange=async e=>{const file=e.target.files[0];if(!file)return;const text=await file.text();const rows=parseContactsCsv(text);if(!rows.length){toast('No phone numbers found in that file');return}if(!confirm(`Import ${rows.length} contacts with phone numbers? Existing guests are merged, not overwritten.`))return;const {data:r,error}=await sb.rpc('admin_import',{p_pass:pass,p_rows:rows});if(error){toast('Import failed');return}toast(`Added ${r.added}, merged ${r.merged}, skipped ${r.skipped}`);renderGuestList(pass)};
}
function parseCsv(text){const rows=[];let row=[],cur='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else{if(c==='"')q=true;else if(c===','){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}else cur+=c}}if(cur.length||row.length){row.push(cur);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))}
function parseContactsCsv(text){
 const rows=parseCsv(text); if(rows.length<2)return []; const H=rows[0].map(h=>h.trim().toLowerCase());
 const idx=n=>H.findIndex(h=>h===n); const find=re=>H.map((h,i)=>re.test(h)?i:-1).filter(i=>i>=0);
 const iName=idx('name')>=0?idx('name'):idx('display name'); const iFirst=idx('first name'),iLast=idx('last name'),iOrg=idx('organization name')>=0?idx('organization name'):idx('organization 1 - name');
 const phoneCols=find(/^phone \d+ - value$/).concat(find(/^(mobile|phone|cell)( phone)?$/)); const iLabels=idx('labels')>=0?idx('labels'):idx('group membership');
 const out=[]; for(const r of rows.slice(1)){
  let name=(iName>=0?r[iName]:'')||[iFirst>=0?r[iFirst]:'',iLast>=0?r[iLast]:''].join(' ').trim()||(iOrg>=0?r[iOrg]:''); name=(name||'').trim();
  let phone=''; for(const c of phoneCols){const v=(r[c]||'').split(':::')[0].replace(/\D/g,'');const d=v.length===11&&v[0]==='1'?v.slice(1):v;if(d.length===10){phone=d;break}}
  if(!phone)continue;
  const labels=(iLabels>=0?(r[iLabels]||''):'').split(/\s*:::\s*|\s*,\s*/).map(l=>l.replace(/^\* /,'').replace(/^myContacts$/i,'').replace(/^starred$/i,'').trim()).filter(Boolean);
  out.push({name,phone,labels});
 } return out;
}

/* ---------- pager: pages scroll inside, firm pull or chevron moves between pages ---------- */
const P={i:0,lock:false,y0:0,t0:0,armed:0};
const pages=()=>[...document.querySelectorAll('#app>section')];
function goTo(i){const ps=pages();i=Math.max(0,Math.min(ps.length-1,i));if(P.lock)return;P.lock=true;P.i=i;
 ps[i].scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>{P.lock=false;updateBar()},550);updateNav()}
function atTop(el){return el.scrollTop<=1}
function atBottom(el){const rem=el.scrollHeight-(el.scrollTop+el.clientHeight); return rem<=2 || (el.id==='ev-hero' && rem<=140) || rem<=90}
function curPage(){const ps=pages();const top=$('#app').scrollTop;let best=0,d=1e9;ps.forEach((p,k)=>{const dd=Math.abs(p.offsetTop-top);if(dd<d){d=dd;best=k}});return best}
function initPager(){
 const app=$('#app'); const TH=120;
 // Paging only happens when a swipe BEGINS with the page already resting at its edge.
 // The swipe that scrolls you to the bottom never pages; the next deliberate pull does.
 app.addEventListener('touchstart',e=>{const sec=e.target.closest('#app>section');P.y0=e.touches[0].clientY;P.t0=Date.now();P.eT=sec?atTop(sec):false;P.eB=sec?atBottom(sec):false;P.sec=sec},{passive:true});
 app.addEventListener('touchend',e=>{
  if(P.lock||!P.sec)return; const dy=P.y0-(e.changedTouches[0].clientY); const fast=Date.now()-P.t0<700;
  if(P.eB&&dy>TH&&atBottom(P.sec)&&fast)goTo(curPage()+1);
  else if(P.eT&&dy<-TH&&atTop(P.sec)&&fast)goTo(curPage()-1);
 },{passive:true});
 let acc=0,last=0,edgeSince=0;
 app.addEventListener('wheel',e=>{
  const sec=e.target.closest('#app>section'); if(!sec||P.lock)return; const now=Date.now();
  const atEdge=(e.deltaY>0&&atBottom(sec))||(e.deltaY<0&&atTop(sec));
  if(!atEdge){acc=0;edgeSince=0;return}
  if(!edgeSince){edgeSince=now;acc=0;return} // first tick at the edge just marks arrival
  if(now-last>500)acc=0; last=now; acc+=e.deltaY;
  if(now-edgeSince>250&&Math.abs(acc)>200){goTo(curPage()+(acc>0?1:-1));acc=0;edgeSince=0}
 },{passive:true});
 window.addEventListener('resize',()=>{const ps=pages();if(ps[P.i])ps[P.i].scrollIntoView({block:'start'})});
}

/* ---------- boot ---------- */
async function boot(){
 document.querySelectorAll('#lang button').forEach(b=>b.onclick=()=>{S.lang=b.dataset.l;ls('lang',S.lang);render()});
 const {data:evs}=await sb.from('events').select('*').order('sort'); S.events=evs||[];
 const {data:counts}=await sb.rpc('event_counts'); S.counts=counts||{};
 loadLocal(); await loadVia(); await loadFamily();
 render(); jumpDeep();
 initPager(); $('#app').addEventListener('scroll',updateNav,{passive:true});
 document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab)); if(S.invites) loadFramily();
 $('#barBtn').onclick=()=>{const lk=$('#lock');if(lk)goTo(pages().indexOf(lk))};
}
boot();
</script>
</body>
